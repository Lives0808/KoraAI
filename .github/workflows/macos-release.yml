name: macOS release

# Builds the macOS desktop app on a GitHub-hosted runner (which ships with
# Xcode) and attaches the zipped .app to an existing release.
#
# This exists so publishing a macOS build does not require a local Xcode
# installation.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the build to'
        required: true
        default: 'v1.0.0'
      ref:
        description: 'Git ref to build (defaults to the tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyse and test
        run: |
          flutter analyze
          flutter test

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          PRODUCTS=build/macos/Build/Products/Release
          NAME="KoraAI-${VERSION}-macos.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$PRODUCTS" >> "$GITHUB_OUTPUT"
          echo "path=$PRODUCTS/$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$PRODUCTS"
          (cd "$PRODUCTS" && ditto -c -k --keepParent KoraAI.app "$NAME")
          (cd "$PRODUCTS" && shasum -a 256 "$NAME" > "$NAME.sha256" && cat "$NAME.sha256")
          ls -lh "$PRODUCTS/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: kora-ai-macos
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "${{ inputs.tag }}" \
            "${{ steps.package.outputs.path }}" \
            "${{ steps.package.outputs.path }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY"
